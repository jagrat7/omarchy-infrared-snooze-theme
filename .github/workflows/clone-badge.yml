name: Update clone badge

on:
  schedule:
    - cron: '17 6 * * *' # Daily at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clone-badge
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'jagrat7/omarchy-infrared-snooze-theme'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch clone statistics and update badge
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Add the TRAFFIC_TOKEN repository secret with Administration: read permission.'
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/traffic/clones" > "$RUNNER_TEMP/clones.json"
          python3 .github/scripts/update-clone-badge.py < "$RUNNER_TEMP/clones.json"

      - name: Commit updated badge
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: refresh clone count badge'
          git push origin "HEAD:$DEFAULT_BRANCH"
