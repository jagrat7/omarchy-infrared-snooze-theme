# Infrared Snooze
#
# A dim room lit by a heat lamp. Warm red-black surfaces, a red-led warm
# spectrum (ember red first, then amber and honey) for anything that glows, and dim dusty colours for
# everything else. This file is the source of truth: every other file in the
# theme takes its colours from here.
#
# Kept dim on purpose: the text is about 40% of white instead of 70%, and
# every colour keeps its blue channel low. Warm colours (ember, amber, honey)
# come mostly from the red subpixel; the cool ones are dimmed and greyed so
# they give out as little blue as they can while still reading as blue,
# cyan or magenta.

mode = "dark"

# Ember red: focus, cursor, active border. The theme's red. Leans slightly
# orange so it never reads as an error.
accent = "#cc432e"
selection = "#3d1f1c"
muted = "#785c56"

background = "#150b0b"
dark_background = "#0f0808"
darker_background = "#090505"
lighter_background = "#211312"

foreground = "#c2a08e"
dark_foreground = "#896d65"
light_foreground = "#b69684"
bright_foreground = "#d8b8a2"

# Errors and deletions. Leans pink, so it stays apart from the ember red accent.
red = "#c2445f"
yellow = "#c99a4a"
orange = "#d27a3a"
green = "#869a5a"
cyan = "#6f8f84"
blue = "#737ea0"
magenta = "#a46f8a"
brown = "#6b3f30"

bright_red = "#d85c74"
bright_yellow = "#dcb060"
bright_green = "#9db06b"
bright_cyan = "#84a597"
bright_blue = "#8892b3"
bright_magenta = "#bb83a0"

# Shared by Hyprland window borders and the Omarchy shell (popups,
# notifications, lock screen). Deep red to ember red to amber.
hyprland_active_border = "rgba(9e2418dd) rgba(cc432edd) rgba(d27a3abb) 45deg"
hyprland_inactive_border = "rgba(3d1f1c99)"
