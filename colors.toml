# Infrared Snooze
#
# A dim room lit by a heat lamp. Warm red-black surfaces, a dim red
# glow for focus, and soft dusty colours for everything else.
# This file is the source of truth: every other file in the theme takes
# its colours from here.

mode = "dark"

# Sleep red: focus, cursor, active border. Green and blue stay at 00 (the
# screen light least likely to keep you awake) and it is kept dim for low
# contrast. Errors use the pinker `red` below so focus never reads as one.
accent = "#b30000"
selection = "#3b1c22"
muted = "#7d5d60"

background = "#130b0d"
dark_background = "#0d0709"
darker_background = "#080405"
lighter_background = "#1f1215"

foreground = "#ead2ca"
dark_foreground = "#8c6f6d"
light_foreground = "#d6bab3"
bright_foreground = "#fcece6"

# Errors and deletions. Pinker than `accent` on purpose.
red = "#e8476a"
yellow = "#f2a65a"
orange = "#ff8650"
green = "#a3b87c"
cyan = "#7fb5ab"
blue = "#8d9fd8"
magenta = "#d27aa8"
brown = "#6b3b2e"

bright_red = "#ff6f8c"
bright_yellow = "#ffc485"
bright_green = "#bfd49a"
bright_cyan = "#a2d2c8"
bright_blue = "#aebdf2"
bright_magenta = "#ef9fc6"

# Shared by Hyprland window borders and the Omarchy shell (popups,
# notifications, lock screen). Dim red fading to darker red, green and
# blue at 00.
hyprland_active_border = "rgba(b30000ee) rgba(4d0000cc) 45deg"
hyprland_inactive_border = "rgba(3b1c2299)"
